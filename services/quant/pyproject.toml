[project]
name = "portfoliopilot-quant"
version = "0.1.0"
description = "Quant engine for PortfolioPilot."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scipy==1.18.1",
  "cvxpy==1.9.2",
  "yfinance==1.7.0",
  "pyarrow==25.0.1",
  "statsmodels==0.15.0",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6", "black==26.5.1"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py312"]

[build-system]
requires = ["setuptools==84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
