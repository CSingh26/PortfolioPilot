name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfoliopilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @portfoliopilot/api prisma:generate

      - name: Install Python dependencies
        run: python -m pip install -r services/quant/requirements.lock -e "services/quant[dev]"

      - name: Lint
        run: pnpm lint

      - name: Python lint
        run: python -m ruff check services/quant/app services/quant/tests

      - name: Tracked secret-pattern scan
        run: python scripts/check-secrets.py

      - name: Dependency audit
        run: pnpm audit --audit-level=low

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Pytest
        run: python -m pytest services/quant/tests

      - name: Build
        run: pnpm build
